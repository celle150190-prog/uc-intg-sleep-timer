name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt -r test-requirements.txt
      - run: PYTHONPATH=intg-sleep-timer python -m unittest discover tests
      - run: python -m ruff check intg-sleep-timer tests
      - run: python -m ruff format --diff intg-sleep-timer tests
